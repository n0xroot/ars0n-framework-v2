services:
  nginx:
    container_name: bb-nginx-1
    build: ./nginx
    ports:
      - "8081:8081"
    depends_on:
      - api
      - client
    restart: unless-stopped
    networks:
      - ars0n-network

  api:
    container_name: bb-api-1
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ars0n
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ars0n
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - temp_data:/tmp
      - ./wordlists:/app/wordlists
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    dns_search: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ars0n-network

  ai_service:
    container_name: bb-ai-service-1
    build: ./ai_service
    ports:
      - "7000:7000"
    depends_on:
      - api
    environment:
      API_URL: http://api:7443
    restart: unless-stopped
    networks:
      - ars0n-network
    profiles:
      - ai

  db:
    container_name: bb-db-1
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ars0n
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ars0n-network

  client:
    container_name: bb-client-1
    build: ./client
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ars0n-network

  mcp-server:
    container_name: ars0n-framework-v2-mcp-server-1
    build: ./docker/mcp-server
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ars0n
      MCP_PORT: "2001"
      API_URL: http://api:8443
    restart: unless-stopped
    networks:
      - ars0n-network

  assetfinder:
    container_name: bb-assetfinder-1
    build: ./docker/assetfinder
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  metabigor:
    container_name: bb-metabigor-1
    build: ./docker/metabigor
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  sublist3r:
    container_name: bb-sublist3r-1
    build: ./docker/sublist3r
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  subfinder:
    container_name: bb-subfinder-1
    build: ./docker/subfinder
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  shuffledns:
    container_name: bb-shuffledns-1
    build: ./docker/shuffledns
    volumes:
      - ./docker/shuffledns/wordlists:/app/wordlists
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  cewl:
    container_name: bb-cewl-1
    build: ./docker/cewl
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  gospider:
    container_name: bb-gospider-1
    build:
      context: .
      dockerfile: docker/gospider/Dockerfile
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  subdomainizer:
    container_name: bb-subdomainizer-1
    build:
      context: .
      dockerfile: docker/subdomainizer/Dockerfile
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  nuclei:
    container_name: bb-nuclei-1
    build: ./docker/nuclei
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    shm_size: '2g'
    restart: "no"
    networks:
      - ars0n-network

  katana:
    container_name: bb-katana-1
    build:
      context: ./docker/katana
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - ars0n-network

  httpx:
    container_name: bb-httpx-1
    build: ./docker/httpx
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  dnsx:
    container_name: bb-dnsx-1
    build: ./docker/dnsx
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  ffuf:
    container_name: bb-ffuf-1
    build: ./docker/ffuf
    depends_on:
      - api
    volumes:
      - ./wordlists:/app/wordlists
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  github-recon:
    container_name: bb-recon-1
    build: ./docker/github-recon
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  cloud_enum:
    container_name: bb-cloud_enum-1
    build:
      context: .
      dockerfile: docker/cloud_enum/Dockerfile
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  linkfinder:
    container_name: bb-linkfinder-1
    build: ./docker/linkfinder
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  waybackurls:
    container_name: bb-waybackurls-1
    build: ./docker/waybackurls
    depends_on:
      - api
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  arjun:
    container_name: ars0n-framework-v2-arjun-1
    build: ./docker/arjun
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  parameth:
    container_name: ars0n-framework-v2-parameth-1
    build: ./docker/parameth
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

  x8:
    container_name: ars0n-framework-v2-x8-1
    build: ./docker/x8
    depends_on:
      - api
    volumes:
      - temp_data:/tmp
    entrypoint: ["sleep", "infinity"]
    restart: "no"
    networks:
      - ars0n-network

volumes:
  postgres_data:
  temp_data:

networks:
  ars0n-network:
    driver: bridge
